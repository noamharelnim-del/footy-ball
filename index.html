  main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}

  .avatar{
    width:112px;height:112px;margin:0 auto 18px;border-radius:50%;
    display:grid;place-items:center;font-size:62px;
    background:radial-gradient(circle at 35% 30%, #1f5c32, #082814);
    box-shadow:0 12px 30px rgba(0,0,0,.45);
    animation:spin 9s linear infinite;
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar.has-img{animation:none}

  h1{
    font-family:Anton,Impact,sans-serif;font-weight:400;
    font-size:44px;letter-spacing:2px;line-height:1;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  h1 span{color:var(--accent)}
  .handle{margin-top:8px;color:var(--accent);font-weight:700;font-size:15px}
  .bio{margin:10px auto 0;max-width:380px;color:var(--muted);font-size:15px;line-height:1.5}

  .socials{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
  .socials a{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);color:#fff;
    transition:transform .15s, background .15s;
  }
  .socials a:hover{transform:translateY(-3px);background:var(--accent);color:#0b2a17}
  .socials svg{width:20px;height:20px;fill:currentColor}

  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    position:relative;display:flex;align-items:center;gap:14px;
    min-height:62px;padding:10px 12px 10px 54px;border-radius:16px;
    background:var(--card);border:1px solid var(--border);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;text-decoration:none;font-weight:700;font-size:16px;
    transition:transform .15s, background .15s, border-color .15s;
  }
  .link:hover{transform:scale(1.025);background:var(--card-hover);border-color:var(--accent)}
  .link:active{transform:scale(.98)}
  .link .ico{
    flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    font-size:22px;background:rgba(0,0,0,.25);
  }
  .link .ico svg{width:22px;height:22px;fill:currentColor}
  .link .txt{flex:1;text-align:center;line-height:1.25}
  .link small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
  .link .arrow{position:absolute;left:18px;top:50%;transform:translateY(-50%);opacity:.6;font-size:18px}
  .link.featured{
    background:linear-gradient(135deg, var(--accent), #7ee81f);color:#0b2a17;border-color:transparent;
